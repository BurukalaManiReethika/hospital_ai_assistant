
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital AI Assistant</title>
<style>
  :root { --bg:#f4f7f9; --card:#fff; --ink:#1c2b36; --muted:#6b7c88; --brand:#0f766e; --bot:#e6f2f1; --line:#dbe3e8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 640px; margin: 0 auto; height: 100dvh; display:flex; flex-direction:column; padding: 12px; }
  header { padding: 8px 4px 12px; }
  h1 { margin:0; font-size: 1.25rem; }
  header p { margin:4px 0 0; color:var(--muted); font-size:.85rem; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; line-height:1.4; white-space: pre-wrap; font-size:.95rem; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:3px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:3px; }
  .bot.emergency { background:#fde8e8; border:1px solid #f5b5b5; }
  .src { display:block; margin-top:6px; font-size:.75rem; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:10px 0; }
  .chips button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 10px; font-size:.8rem; cursor:pointer; }
  .chips button:hover { border-color: var(--brand); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:1rem; }
  input:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  form button { padding:0 18px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:1rem; cursor:pointer; }
  .note { text-align:center; font-size:.72rem; color:var(--muted); padding-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hospital AI Assistant</h1>
    <p>Ask about timings, appointments, doctors, insurance and more.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type your question..." maxlength="500" aria-label="Your question">
    <button type="submit">Send</button>
  </form>
  <div class="note">General information only, not medical advice. In an emergency call 112.</div>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const samples = ["What are the OPD timings?", "Which doctor treats heart problems?", "Do you accept insurance?", "Is there a child specialist?"];

function add(text, cls, sources) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement("span");
    s.className = "src";
    s.textContent = "Source: " + sources.join("; ");
    d.appendChild(s);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  add(text, "user");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    add(data.answer, "bot" + (data.mode === "emergency" ? " emergency" : ""), data.sources);
  } catch (e) {
    add("Something went wrong. Please try again.", "bot");
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = "";
  ask(t);
});

const chips = document.getElementById("chips");
samples.forEach((s) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = s;
  b.onclick = () => ask(s);
  chips.appendChild(b);
});

add("Hello! I'm the hospital assistant. How can I help you today?", "bot");
</script>
</body>
</html>
